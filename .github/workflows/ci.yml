name: ci

# Format, lint and test the terminal (TUI) crate on every push/PR.
# A gui/ job will be added here when the GUI lands.
# The repository is a single cargo workspace, so everything runs from the root.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terminal:
    name: terminal (fmt / clippy / test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      # Один cargo-workspace на репозиторий: кэш и Cargo.lock корневые.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Пакет выбирается через `-p mygit`, а не сменой каталога: workspace общий,
      # и без `-p` шаги затянули бы ещё и Tauri со всеми его системными зависимостями.
      - name: fmt
        run: cargo fmt -p mygit --check

      - name: clippy
        run: cargo clippy -p mygit --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p mygit --locked
