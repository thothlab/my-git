name: release

# Builds mygit (terminal / TUI) binaries for macOS, Linux and Windows.
#   - The matrix `build` job compiles each target and uploads it as an artifact.
#   - A single `release` job then publishes ONE GitHub Release with all archives
#     (on a v* tag). Doing the publish in one job avoids the create-release race
#     you get when every matrix job tries to create the same tag's release.
#   - On manual dispatch: the artifacts are downloadable from the run (no release).
#
# The GUI (gui/) will get its own build entries here once it exists.
#
# Cut a release:
#   1. Bump `version` in terminal/Cargo.toml (and refresh the root Cargo.lock), commit.
#   2. git tag v0.x.y && git push origin v0.x.y

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,         target: aarch64-apple-darwin,      name: macos-arm64 }
          # Intel Mac cross-compiled on the fast Apple-Silicon runner — the
          # macos-13 (Intel) runner has very long queue times. Deps are pure
          # Rust, so arm64 -> x86_64 cross-compilation needs no extra tooling.
          - { runner: macos-14,         target: x86_64-apple-darwin,       name: macos-x86_64 }
          - { runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { runner: windows-2022,     target: x86_64-pc-windows-msvc,    name: windows-x86_64 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      # Один cargo-workspace на репозиторий: кэш, Cargo.lock и target/ корневые.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build
        run: cargo build -p mygit --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pkg="mygit-${{ github.ref_name }}-${{ matrix.name }}"
          dir="target/${{ matrix.target }}/release"
          tar -C "$dir" -czf "$pkg.tar.gz" mygit
          echo "ASSET=$pkg.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "mygit-${{ github.ref_name }}-${{ matrix.name }}"
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/mygit.exe" -DestinationPath "$pkg.zip"
          "ASSET=$pkg.zip" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          fail_on_unmatched_files: true
          body: |
            **my-git — terminal (TUI)** binaries for `${{ github.ref_name }}`.

            Quick install (no Gatekeeper / `xattr`):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/thothlab/my-git/main/install.sh | sh
            ```

            Or download an archive for your platform, extract, and put `mygit` on your PATH,
            then run `mygit` inside any git repository.

            - **macOS** (arm64 / x86_64): `tar -xzf mygit-*-macos-*.tar.gz && sudo mv mygit /usr/local/bin/`
            - **Linux** (x86_64 / arm64): `tar -xzf mygit-*-linux-*.tar.gz && sudo mv mygit /usr/local/bin/`
            - **Windows** (x86_64): unzip and put `mygit.exe` on your PATH.
