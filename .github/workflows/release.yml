name: release

# Builds mygit (terminal / TUI) binaries for macOS, Linux and Windows.
#   - On a `v*` tag: attaches the archives to a GitHub Release.
#   - On manual dispatch: uploads them as downloadable workflow artifacts.
#
# The GUI (gui/) will get its own job in this file once it exists.
#
# Cut a release:
#   1. Bump `version` in terminal/Cargo.toml, commit.
#   2. git tag v0.x.y && git push --tags
#   3. The matrix builds and attaches archives to the v0.x.y release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terminal:
    name: terminal (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,         target: aarch64-apple-darwin,      name: macos-arm64 }
          - { runner: macos-13,         target: x86_64-apple-darwin,       name: macos-x86_64 }
          - { runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { runner: windows-2022,     target: x86_64-pc-windows-msvc,    name: windows-x86_64 }

    steps:
      - uses: actions/checkout@v4

      # Pinned to the local dev toolchain that builds the locked tree cleanly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terminal

      - name: Build
        working-directory: terminal
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pkg="mygit-${{ github.ref_name }}-${{ matrix.name }}"
          dir="terminal/target/${{ matrix.target }}/release"
          tar -C "$dir" -czf "$pkg.tar.gz" mygit
          echo "ASSET=$pkg.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "mygit-${{ github.ref_name }}-${{ matrix.name }}"
          $dir = "terminal/target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/mygit.exe" -DestinationPath "$pkg.zip"
          "ASSET=$pkg.zip" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          draft: false
          fail_on_unmatched_files: true
          body: |
            **my-git — terminal (TUI)** binaries for `${{ github.ref_name }}`.

            Download the archive for your platform, extract, and put `mygit` on your PATH,
            then run `mygit` inside any git repository.

            - **macOS** (arm64 / x86_64):
              `tar -xzf mygit-*-macos-*.tar.gz && sudo mv mygit /usr/local/bin/`
              (if Gatekeeper blocks it: `xattr -d com.apple.quarantine /usr/local/bin/mygit`)
            - **Linux** (x86_64 / arm64):
              `tar -xzf mygit-*-linux-*.tar.gz && sudo mv mygit /usr/local/bin/`
            - **Windows** (x86_64): unzip and put `mygit.exe` on your PATH.
